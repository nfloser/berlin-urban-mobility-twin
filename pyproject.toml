[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "berlin-urban-mobility-twin"
version = "0.1.0"
description = "Reproducible, explainable digital twin of Berlin's mobility system."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "nfloser"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "gtfs-realtime-bindings>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
berlin-mobility-twin = "berlin_mobility_twin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/berlin_mobility_twin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["berlin_mobility_twin"]

[tool.coverage.run]
source = ["berlin_mobility_twin"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
