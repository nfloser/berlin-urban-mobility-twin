name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src/berlin_mobility_twin
      - name: Tests
        run: pytest --cov=berlin_mobility_twin --cov-report=term-missing
      - name: Integration schema drift
        run: |
          berlin-mobility-twin export-schemas --output-dir /tmp/generated-schemas
          diff -ru schemas /tmp/generated-schemas

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t berlin-urban-mobility-twin:ci .

  live-smoke:
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: python -m pip install -e .
      - name: Real-data smoke test
        run: python scripts/smoke_real_data.py
